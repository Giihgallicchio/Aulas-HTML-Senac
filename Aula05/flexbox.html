<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
 
<body>
    <header>
 
        <h1>Aula de FlexBox</h1>
        <p>Dominando o layout com FlexBox</p>
        <nav class="sumario">
            <ul id="ulNav" class="classe-ul-nav">
                <li><a href="#direction-row">direction-row</a></li>
                <li><a href="#direction-row-reverse">direction-row-reverse</a></li>
                <li><a href="#direction-column">direction-column</a></li>
                <li><a href="#direction-column-reverse">direction-column-reverse</a></li>
            </ul>
        </nav>
 
    </header>
 
    <main>
        <section class="flex-direction">
            <section id="direction-row" class="direction-row">
                <div> 1 </div>
                <div> 2 </div>
                <div> 3 </div>
                <div> 4 </div>
            </section>
 
            <section id="direction-row-reverse" class="direction-row-reverse">

                <div> 2 </div>
                <div> 3 </div>

            </section>
 
            <section id="direction-column" class="direction-column">
                <div> 1 </div>
                <div> 2 </div>
                <div> 3 </div>
                <div> 4 </div>
            </section>
 
            <section id="direction-column-reverse" class="direction-column-reverse">
                <div> 1 </div>
                <div> 2 </div>
                <div> 3 </div>
                <div> 4 </div>
            </section>
        </section>

        <section id="justify-content" class="justify-content">
            <section id="justify-content-flex-start">
                <div> 1 </div>
                <div> 2 </div>
                <div> 3 </div>
                <div> 4 </div>
            </section>
        </section>
 
 
    </main>
 
    <footer></footer>
</body>
 
</html>
